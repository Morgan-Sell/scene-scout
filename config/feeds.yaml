# SceneScout Feed Configuration
#
# Each feed entry defines an event source and its metadata.
# source_type: rss (default) | ical | api | scrape — selects the ingestion adapter.
# source_quality_score: 0.0–1.0. Higher = more reliable event data.
# Only working event sources belong here — remove entries that cannot ingest.

feeds:
  - id: brooklynvegan
    name: BrooklynVegan
    url: https://www.brooklynvegan.com/feed/
    city: New York
    source_quality_score: 0.85
    active: true
    notes: "NYC music and show listings. Strong event signal."

  - id: theskint
    name: the skint
    url: https://www.theskint.com/feed/
    city: New York
    source_quality_score: 0.90
    active: true
    notes: "Free and cheap NYC events. Curated weekly listings."

  - id: brooklyn_rail
    name: Brooklyn Rail Events
    url: https://brooklynrail.org/events
    city: New York
    source_quality_score: 0.80
    source_type: scrape
    active: true
    scrape:
      strategy: css
      item_selector: 'div[class*="events_card"]'
      title_selector: h2
      link_selector: a
    notes: >
      Readings, panels, and creative community events. CSS scrape verified Jun 2026.

  - id: harlem_one_stop
    name: Harlem One Stop
    url: https://www.harlemonestop.org/
    city: New York
    source_quality_score: 0.80
    source_type: scrape
    active: true
    scrape:
      strategy: css
      item_selector: 'div.tile:has(a[href^="/event/"])'
      title_selector: a
      link_selector: a
    notes: >
      Harlem cultural events calendar. One row per event on homepage tiles.
