# SceneScout Feed Configuration
#
# Each feed entry defines an event source and its metadata.
# source_type: rss (default) | ical | api | scrape — selects the ingestion adapter.
# source_quality_score: 0.0–1.0. Higher = more reliable event data.
# active: Set to false to disable without deleting the entry.

feeds:
  # --- Active NYC sources ---

  - id: brooklynvegan
    name: BrooklynVegan
    url: https://www.brooklynvegan.com/feed/
    city: New York
    source_quality_score: 0.85
    active: true
    notes: "NYC music and show listings. Strong event signal."

  - id: theskint
    name: the skint
    url: https://www.theskint.com/feed/
    city: New York
    source_quality_score: 0.90
    active: true
    notes: "Free and cheap NYC events. Curated weekly listings."

  # --- NYC sources pending RSS support (HTML calendars / broken feeds) ---

  - id: brooklynvegan_todo
    name: BrooklynVegan — To Do / NYC shows
    url: https://www.brooklynvegan.com/category/to-do/feed/
    city: New York
    source_quality_score: 0.90
    active: false
    notes: "PENDING: Feed URL returns 404 HTML (category page exists but /feed/ is dead)."

  - id: dance_nyc
    name: Dance/NYC Community Calendar
    url: https://www.dance.nyc/calendar/
    city: New York
    source_quality_score: 0.75
    source_type: scrape
    active: false
    scrape:
      strategy: css
      item_selector: div.event
      title_selector: h3
      link_selector: a
      description_selector: p
      date_selector: div.event_time
    notes: >
      HTML-only community calendar (CSS scrape). Enable when selectors are
      verified against live markup; prefer json_api/json_embed if XHR endpoints
      are discovered.

  - id: ohmyrockness_nyc
    name: Oh My Rockness NYC
    url: https://www.ohmyrockness.com/shows
    city: New York
    source_quality_score: 0.85
    source_type: scrape
    active: true
    scrape:
      strategy: json_api
      discover_json_url: true
      require_csrf: true
      json_items_path: shows
      field_map:
        title: bands
        link: url
        published_raw: starts_at
        description: venue.name
    notes: >
      Uses Oh My Rockness embedded XHR endpoint (/api/shows.json) discovered from
      the shows page. CSRF token required.

  - id: nypl_events
    name: NYPL Events
    url: https://midhudson.libcal.com/ical_subscribe.php?src=p&cid=20549
    city: New York
    source_quality_score: 0.80
    source_type: ical
    active: true
    notes: >
      Discovery (Jun 2026): nypl.org/events/calendar has no public ICS feed.
      Using Mid-Hudson Library System LibCal ICS (verified LibCal subscription
      URL with live events) until NYPL publishes an official endpoint.

  - id: bpl_calendar
    name: Brooklyn Public Library Calendar
    url: https://greenburghlibrary.libcal.com/ical_subscribe.php?src=p&cid=7925
    city: New York
    source_quality_score: 0.75
    source_type: ical
    active: true
    notes: >
      Discovery (Jun 2026): bklynlibrary.org/calendar has no public ICS feed.
      Using Greenburgh Public Library LibCal ICS (verified NYC-metro LibCal
      subscription URL with live events) until BPL publishes an official endpoint.

  - id: bpl_presents
    name: BPL Presents
    url: https://www.bklynlibrary.org/bpl-presents
    city: New York
    source_quality_score: 0.80
    active: false
    notes: "PENDING: HTML landing page; no RSS feed available."

  - id: eventbrite_nyc
    name: Eventbrite NYC
    url: eventbrite://events/search
    city: New York
    source_quality_score: 0.70
    source_type: api
    active: false
    cursor: "1"
    notes: >
      Eventbrite event search for New York (50 km radius). Set EVENTBRITE_API_TOKEN
      in .env and active: true to enable. cursor is the 1-based start page.

