# SceneScout Feed Configuration
#
# Product direction: docs/260705_product_redesign.md
# Build phases: docs/project_plan.md — Phase 1C (city-scoped ingest, mainstream catalog)
#
# Each feed entry defines an event source and its metadata.
# source_type: rss (default) | ical | api | scrape — selects the ingestion adapter.
# source_quality_score: 0.0–1.0. Higher = more reliable event data.
# city: metro tag for local feeds; matched against UserProfile.home_city at ingest.
# is_national: true — always included for every user; national API adapters query
#   using profile.home_city (not feed.city). Use for Ticketmaster, Eventbrite, etc.
#
# Default metro (launch): New York. Active mainstream set: donyc + theskint.
# Tier B/C smoke: donyc,theskint (see docs/260705_product_redesign.md).

feeds:
  # --- New York — active mainstream ---

  - id: donyc
    name: DoNYC
    url: https://donyc.com/events
    city: New York
    source_quality_score: 0.85
    source_type: scrape
    active: true
    scrape:
      strategy: css
      item_selector: ".event-card"
      title_selector: ".ds-listing-event-title-text"
      link_selector: "a.ds-listing-event-title"
      description_selector: ".ds-venue-name"
      date_selector: '[itemprop="startDate"]'
    notes: >
      Structured NYC aggregator — venue and ISO start time on listing cards.
      Primary mainstream source for New York (Phase 1C.3).

  - id: theskint
    name: the skint
    url: https://www.theskint.com/feed/
    city: New York
    source_quality_score: 0.90
    active: true
    notes: >
      Curated free and cheap NYC events. Secondary mainstream listing feed for New York.

  # --- National APIs — inactive until endpoints and tokens are configured ---

  - id: eventbrite
    name: Eventbrite
    url: eventbrite://events/search
    city: New York
    is_national: true
    source_quality_score: 0.70
    source_type: api
    active: false
    notes: >
      Inactive — public /v3/events/search/ returns HTTP 404 (Jul 2026). Re-enable when
      a supported org-owned or partner API endpoint exists. Requires EVENTBRITE_API_TOKEN.

  - id: ticketmaster
    name: Ticketmaster
    url: ticketmaster://events/search
    city: New York
    is_national: true
    source_quality_score: 0.85
    source_type: api
    active: false
    notes: >
      Placeholder — implement adapter and market/geo mapping in Phase 1B.3 follow-on.
      Requires TICKETMASTER_API_KEY when enabled.

  - id: seatgeek
    name: SeatGeek
    url: seatgeek://events/search
    city: New York
    is_national: true
    source_quality_score: 0.80
    source_type: api
    active: false
    notes: >
      Placeholder — national inventory API slot. Requires SEATGEEK_CLIENT_ID when enabled.

  - id: songkick
    name: Songkick
    url: songkick://events/search
    city: New York
    is_national: true
    source_quality_score: 0.75
    source_type: api
    active: false
    notes: >
      Placeholder — national concert API slot. Requires SONGKICK_API_KEY when enabled.

  # --- Retired indie / editorial / fragile sources (Phase 1C.3) ---

  - id: brooklynvegan
    name: BrooklynVegan
    url: https://www.brooklynvegan.com/feed/
    city: New York
    source_quality_score: 0.85
    active: false
    notes: >
      Retired — editorial music RSS; high extraction discard rate. See 260705_product_redesign.md.

  - id: brooklyn_rail
    name: Brooklyn Rail Events
    url: https://brooklynrail.org/events
    city: New York
    source_quality_score: 0.80
    source_type: scrape
    active: false
    scrape:
      strategy: css
      item_selector: 'div[class*="events_card"]'
      title_selector: h2
      link_selector: a
      date_selector: "p.text-xs.uppercase"
      description_selector: "span.uppercase.font-normal"
    notes: >
      Retired — fragile indie scrape; deprioritized per product redesign.

  - id: harlem_one_stop
    name: Harlem One Stop
    url: https://www.harlemonestop.org/
    city: New York
    source_quality_score: 0.80
    source_type: scrape
    active: false
    scrape:
      strategy: css
      item_selector: 'div.tile:has(a[href^="/event/"])'
      title_selector: "a h6"
      link_selector: a
      description_selector: "span.date b"
      date_selector: "span.date"
    notes: >
      Retired — fragile community scrape; deprioritized per product redesign.

  - id: bkmag
    name: Brooklyn Magazine
    url: https://www.bkmag.com/feed/
    city: New York
    source_quality_score: 0.55
    active: false
    notes: >
      Retired — lifestyle editorial RSS; weak event signal per product redesign.

  - id: bk_reader
    name: BK Reader
    url: https://www.bkreader.com/rss/
    city: New York
    source_quality_score: 0.50
    active: false
    notes: >
      Retired — neighborhood news RSS; supplemental editorial, not mainstream inventory.
