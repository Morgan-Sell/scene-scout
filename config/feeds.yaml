# SceneScout Feed Configuration
#
# Each feed entry defines an event source and its metadata.
# source_type: rss (default) | ical | api | scrape — selects the ingestion adapter.
# source_quality_score: 0.0–1.0. Higher = more reliable event data.
# city: metro tag for local feeds; matched against UserProfile.home_city at ingest.
# is_national: true — always included for every user; national API adapters query
#   using profile.home_city (not feed.city). Use for Ticketmaster, Eventbrite, etc.
# Only working event sources belong here — remove entries that cannot ingest.
# Tier B/C UAT default (mainstream NYC): donyc,theskint — see docs/260705_product_redesign.md
# Always pass --city and --horizon-days on UAT to match UserProfile (or set UAT_* env vars).

feeds:
  - id: brooklynvegan
    name: BrooklynVegan
    url: https://www.brooklynvegan.com/feed/
    city: New York
    source_quality_score: 0.85
    active: true
    notes: "NYC music and show listings. Strong event signal."

  - id: theskint
    name: the skint
    url: https://www.theskint.com/feed/
    city: New York
    source_quality_score: 0.90
    active: true
    notes: "Free and cheap NYC events. Curated weekly listings."

  - id: donyc
    name: DoNYC
    url: https://donyc.com/events
    city: New York
    source_quality_score: 0.85
    source_type: scrape
    active: true
    scrape:
      strategy: css
      structured_ingest: true
      item_selector: ".event-card"
      title_selector: ".ds-listing-event-title-text"
      link_selector: "a.ds-listing-event-title"
      description_selector: ".ds-venue-name"
      date_selector: '[itemprop="startDate"]'
    notes: >
      NYC event listings with venue and start time on listing cards. Verified Jul 2026.

  - id: eventbrite_nyc
    name: Eventbrite NYC
    url: eventbrite://events/search
    city: New York
    is_national: true
    source_quality_score: 0.70
    source_type: api
    active: false
    notes: >
      NYC-area events via Eventbrite search API. Inactive: public search endpoint returns
      404 until a supported API path is configured. Requires EVENTBRITE_API_TOKEN.

  - id: brooklyn_rail
    name: Brooklyn Rail Events
    url: https://brooklynrail.org/events
    city: New York
    source_quality_score: 0.80
    source_type: scrape
    active: true
    scrape:
      strategy: css
      item_selector: 'div[class*="events_card"]'
      title_selector: h2
      link_selector: a
      date_selector: "p.text-xs.uppercase"
      description_selector: "span.uppercase.font-normal"
    notes: >
      Readings, panels, and creative community events. CSS scrape verified Jun 2026.

  - id: harlem_one_stop
    name: Harlem One Stop
    url: https://www.harlemonestop.org/
    city: New York
    source_quality_score: 0.80
    source_type: scrape
    active: true
    scrape:
      strategy: css
      item_selector: 'div.tile:has(a[href^="/event/"])'
      title_selector: "a h6"
      link_selector: a
      description_selector: "span.date b"
      date_selector: "span.date"
    notes: >
      Harlem cultural events calendar. Homepage tiles with venue and date range.

  - id: bkmag
    name: Brooklyn Magazine
    url: https://www.bkmag.com/feed/
    city: New York
    source_quality_score: 0.55
    active: true
    notes: >
      Weekend guides and NYC lifestyle listings. Mixed editorial signal; lower quality score.

  - id: bk_reader
    name: BK Reader
    url: https://www.bkreader.com/rss/
    city: New York
    source_quality_score: 0.50
    active: true
    notes: >
      Brooklyn neighborhood news with occasional event coverage. Supplemental source.
