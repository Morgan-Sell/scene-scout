name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff check
        run: uv run ruff check scene_scout tests

      - name: Ruff format
        run: uv run ruff format --check scene_scout tests

      - name: Run tests
        run: uv run pytest
        env:
          # CI runs unit/integration tests only — no live LLM or email.
          DRY_RUN: "true"
