[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-scout"
version = "0.1.0"
description = "A personalized event discovery agent"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",       # RSS/Atom parsing — deterministic, spec-compliant
    "icalendar>=6.0",        # iCal/ICS parsing for library calendar sources
    "pydantic>=2.0",         # Schema definition and validation
    "pyyaml>=6.0",           # Feed config file parsing
    "httpx>=0.27",           # HTTP client for feed fetching (async-capable)
    "python-dotenv>=1.0",    # Environment variable loading
    "beautifulsoup4>=4.12",  # HTML calendar scraping (Phase 1B.4)
    "rich>=13.0",            # Color-coded per-agent terminal logging
    "litellm>=1.0",          # Unified LLM provider interface
    "jinja2>=3.0",           # Prompt template rendering
    "python-dateutil>=2.9",  # Fuzzy date parsing in normalization
    "rapidfuzz>=3.0",        # Deterministic fuzzy deduplication
    "chromadb>=0.5",         # Liked-event vector index (vol-chroma)
    "sentence-transformers>=3.0",  # Local embeddings for semantic similarity
    "sqlalchemy>=2.0",         # Feedback and history SQLite stores
    "alembic>=1.13",           # Schema migrations for feedback/history DBs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1",       # Coverage reporting in CI and local dev
    "respx>=0.21",           # HTTP mocking for tests
    "ruff>=0.15",            # Lint and format
]
web = [
    "fastapi>=0.111",        # Web UI API — web container only
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scene_scout*"]

[tool.setuptools.package-data]
scene_scout = ["prompts/*.txt", "web/static/*"]

